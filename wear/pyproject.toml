[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-mitsuba-render"
version = "0.2.0"
description = "Mitsuba 3 wear videos from TextureFriction --record HDF5 recordings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mitsuba>=3.5",
    "h5py>=3.0",
    "numpy>=1.24",
    "Pillow>=10.1",
    "typer>=0.9",
    "tqdm>=4.60",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tf-render = "tf_render.cli:main"

[tool.setuptools.packages.find]
include = ["tf_render*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
