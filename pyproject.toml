[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitsuba_scene_rendering"
version = "0.2.0"
description = "A modular Mitsuba 3 scene rendering project with video/GIF creation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]",
    "rich",
    "python-dotenv",
    "jsonschema",
    "mitsuba>=3.9,<3.10",
    "rpds",
    "xmltodict",
    "xmlschema",
    "numpy",
    "tqdm",
    "gradio"
]
authors = [
    { name = "Antoine Boucher", email = "antoine@antoineboucher.info" }
]
license = "MIT"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"packages/mitsuba_video/src/mitsuba_video/blend.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["packages/mitsuba_video/tests"]
addopts = "-p no:cacheprovider"
